<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Técnico ADREN</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 50px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .header-logo img {
            height: 65px; 
            width: auto;
            display: block;
        }

        .header-title {
            font-size: 14px;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center; 
        }

        .hero-section h1 {
            font-size: 32px;
            color: #1a2b4c;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .hero-section p {
            color: #475569;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* Panel de Selección Inicial Obligatoria */
        .selection-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        .select-card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 30px 40px;
            width: 260px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .select-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #1a2b4c;
        }

        .select-card .icon {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
        }

        .select-card h2 {
            margin: 0;
            font-size: 18px;
            color: #1a2b4c;
        }

        /* Área del Buscador (Oculta al principio) */
        .search-section {
            display: none;
        }

        .search-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .search-wrapper input {
            width: 350px;
            padding: 10px 15px;
            border: 1px solid #7a7a7a;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .status-message {
            color: #475569;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* Botón para regresar al menú inicial */
        .btn-back {
            background: none;
            border: none;
            color: #64748b;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 30px;
        }

        .btn-back:hover {
            color: #1e293b;
        }

        /* Cuadrículas y Listados de Resultados */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
            margin-top: 20px;
            text-align: left;
        }

        .product-card {
            background-color: #ffffff;
            border-left: 4px solid #e1000f;
            border-radius: 4px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #1a2b4c;
        }

        .product-card .sku {
            font-size: 12px;
            color: #777;
            background-color: #f0f2f5;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .mp-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            margin: 20px auto 0 auto;
            text-align: left;
        }

        .mp-card {
            background-color: #ffffff;
            border-left: 6px solid #0284c7;
            border-top: 1px solid #cbd5e1;
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .mp-info h3 {
            margin: 0;
            font-size: 16px;
            color: #1a2b4c;
        }

        .mp-info p {
            margin: 4px 0 0 0;
            color: #475569;
            font-size: 15px;
        }

        .actions-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            box-sizing: border-box;
        }

        .btn-action-tds {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .btn-action-sds {
            background-color: #fce8e6;
            color: #d93025;
        }

        .btn-action-mp-ht {
            background-color: #e1000f;
            color: #ffffff;
            white-space: nowrap;
        }

        .no-file-msg {
            color: #94a3b8;
            font-size: 13px;
            font-style: italic;
            white-space: nowrap;
        }

        .highlight {
            background-color: rgba(22, 163, 74, 0.15);
            padding: 0 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <img src="./logo adren pag.jpg" alt="ADREN"> 
        </div>
        <div class="header-title">Centro de Documentación Técnica</div>
    </header>

    <main>
        <div class="hero-section">
            <h1>Hojas Técnicas y de Seguridad</h1>
            <p id="mainSubtitle">Seleccione el tipo de documentación que desea buscar.</p>
        </div>

        <div class="selection-container" id="initialMenu">
            <div class="select-card" onclick="openSearch('productos')">
                <span class="icon">📦</span>
                <h2>Productos Terminados</h2>
            </div>
            <div class="select-card" onclick="openSearch('materias')">
                <span class="icon">🧪</span>
                <h2>Materias Primas</h2>
            </div>
        </div>

        <div class="search-section" id="searchSection">
            <button class="btn-back" onclick="resetToMenu()">⬅ Volver a la selección principal</button>
            
            <div class="search-wrapper">
                <input type="text" id="mainSearch" placeholder="Escriba el código o número..." autocomplete="off">
            </div>

            <div class="status-message" id="textIndicador"></div>

            <div class="results-grid" id="productosContainer"></div>
            <div class="mp-list" id="materiasContainer" style="display: none;"></div>
        </div>
    </main>

            {codigo: "A1168", descripcion: "Polivinyl-butiral", archivo_ht: "HT_A1168.pdf"},
            {codigo: "A1169", descripcion: "Phenolic resin bakelite", archivo_ht: "HT_A1169.pdf"},
            {codigo: "A1170", descripcion: "Hexane high purity 95%", archivo_ht: "HT_A1170.pdf"},
            {codigo: "A1171", descripcion: "Thiophen benzoxazole derivate", archivo_ht: "HT_A1171.pdf"},
            {codigo: "A1172", descripcion: "Phenol formaldehyde resin", archivo_ht: "HT_A1172.pdf"},
            {codigo: "A1173", descripcion: "Vc/va/maleic acid terpol", archivo_ht: "HT_A1173.pdf"},
            {codigo: "A1174", descripcion: "Modified castor oil derivative", archivo_ht: "HT_A1174.pdf"},
            {codigo: "A1175", descripcion: "Melamine formaldehyde resin", archivo_ht: "HT_A1175.pdf"},
            {codigo: "A1176", descripcion: "Xylene", archivo_ht: "HT_A1176.pdf"},
            {codigo: "A1177", descripcion: "Cellulose acetate butyrate", archivo_ht: "HT_A1177.pdf"},
            {codigo: "A1178", descripcion: "Propylene glycol methyl acetate", archivo_ht: "HT_A1178.pdf"},
            {codigo: "A1179", descripcion: "Epoxy resin BPA/epichlorhydrin 667", archivo_ht: "HT_A1179.pdf"},
            {codigo: "A1180", descripcion: "Hydroxy polyester resin", archivo_ht: "HT_A1180.pdf"},
            {codigo: "A1181", descripcion: "Melamine formaldehyde resin 55% sl", archivo_ht: "HT_A1181.pdf"},
            {codigo: "A1182", descripcion: "1-Methoxy-2-propanol", archivo_ht: "HT_A1182.pdf"}
        ];

        let selectedModule = '';
        const mainSearch = document.getElementById('mainSearch');
        const initialMenu = document.getElementById('initialMenu');
        const searchSection = document.getElementById('searchSection');
        const mainSubtitle = document.getElementById('mainSubtitle');
        const textIndicador = document.getElementById('textIndicador');
        const productosContainer = document.getElementById('productosContainer');
        const materiasContainer = document.getElementById('materiasContainer');

        function openSearch(moduleType) {
            selectedModule = moduleType;
            initialMenu.style.display = 'none';
            searchSection.style.display = 'block';
            mainSearch.value = "";
            productosContainer.innerHTML = "";
            materiasContainer.innerHTML = "";

            if (moduleType === 'productos') {
                mainSubtitle.innerText = "Buscador de Productos Terminados";
                textIndicador.innerText = "Comience a escribir para buscar un producto terminado de las series AV o SV.";
                productosContainer.style.display = 'grid';
                materiasContainer.style.display = 'none';
                mainSearch.placeholder = "Ej: AV101, SV003...";
            } else {
                mainSubtitle.innerText = "Buscador de Materias Primas";
                textIndicador.innerText = "Ingrese un código o descripción para iniciar la búsqueda de materia prima.";
                productosContainer.style.display = 'none';
                materiasContainer.style.display = 'flex';
                mainSearch.placeholder = "Ej: A1103, Resin, Alcohol...";
            }
            setTimeout(() => mainSearch.focus(), 50);
        }

        function resetToMenu() {
            selectedModule = '';
            searchSection.style.display = 'none';
            initialMenu.style.display = 'flex';
            mainSubtitle.innerText = "Seleccione el tipo de documentación que desea buscar.";
        }

        function highlightMatch(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function executeGlobalSearch() {
            let rawQuery = mainSearch.value.trim();
            let query = rawQuery.toUpperCase();

            if (query === "") {
                textIndicador.style.display = "block";
                productosContainer.innerHTML = "";
                materiasContainer.innerHTML = "";
                return;
            }

            textIndicador.style.display = "none";

            if (selectedModule === 'productos') {
                let cleanQuery = query.replace("ADREN", "").replace(/[^A-Z0-9]/g, "");
                const filtered = productosData.filter(item => item.cleanId.includes(cleanQuery));

                if (filtered.length > 0) {
                    productosContainer.innerHTML = filtered.map(item => `
                        <div class="product-card">
                            <div>
                                <h3>${item.name}</h3>
                                <span class="sku">Ref: ${item.id}</span>
                            </div>
                            <div class="actions-layout">
                                <a href="${item.tdsUrl}" class="btn-action btn-action-tds" target="_blank">
                                    📄 Hoja Técnica (TDS)
                                </a>
                                <a href="${item.sdsUrl}" class="btn-action btn-action-sds" target="_blank">
                                    ⚠️ Hoja de Seguridad (SDS)
                                </a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    productosContainer.innerHTML = `<div style="grid-column: 1/-1; color: #d93025; font-weight: 500;">No se encontraron resultados para "${rawQuery}".</div>`;
                }
            } else {
                const filteredMP = materiasData.filter(item => {
                    const cod = item.codigo ? item.codigo.toUpperCase() : '';
                    const desc = item.descripcion ? item.descripcion.toUpperCase() : '';
                    return cod.includes(query) || desc.includes(query);
                });

                if (filteredMP.length > 0) {
                    materiasContainer.innerHTML = filteredMP.map(item => {
                        const codigoResaltado = highlightMatch(item.codigo || '', query);
                        const descripcionResaltada = highlightMatch(item.descripcion || '', query);
                        
                        const actionElement = item.archivo_ht 
                            ? `<a href="./documentos_mp/${item.archivo_ht}" target="_blank" class="btn-action btn-action-mp-ht">📄 Ver Hoja Técnica</a>`
                            : `<span class="no-file-msg">Hoja Técnica no disponible</span>`;

                        return `
                            <div class="mp-card">
                                <div class="mp-info">
                                    <h3>Código: ${codigoResaltado}</h3>
                                    <p>Descripción: ${descripcionResaltada}</p>
                                </div>
                                <div>
                                    ${actionElement}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    materiasContainer.innerHTML = `<div style="color: #d93025; font-weight: 500;">No se encontraron resultados para "${rawQuery}".</div>`;
                }
            }
        }

        mainSearch.addEventListener('input', executeGlobalSearch);
    </script>
</body>
</html>
